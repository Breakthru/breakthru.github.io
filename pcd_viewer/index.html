<!DOCTYPE html>
<html lang="en">
	<head>
		<title>3D Point Cloud Data (.pcd) Viewer</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="threejs/main.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
		
		<style>
			body {
				font-family: 'Plus Jakarta Sans', sans-serif;
				margin: 0;
				padding: 0;
				overflow: hidden;
				background-color: #0b0f19;
			}

			/* Top Left Bar Housing Browse Button & Status Message */
			.top-bar-left {
				position: fixed !important;
				top: 20px !important;
				left: 20px !important;
				right: auto !important;
				bottom: auto !important;
				z-index: 9999 !important;
				display: flex !important;
				flex-direction: column !important;
				align-items: flex-start !important;
				gap: 10px !important;
				max-width: 420px !important;
				width: auto !important;
			}

			/* Prominent Blue File Upload Button */
			.custom-file-upload {
				display: inline-flex !important;
				align-items: center !important;
				gap: 10px !important;
				background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%) !important;
				color: #ffffff !important;
				padding: 14px 26px !important;
				border-radius: 14px !important;
				font-size: 0.98rem !important;
				font-weight: 700 !important;
				cursor: pointer !important;
				box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45) !important;
				transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
				border: 1px solid rgba(255, 255, 255, 0.2) !important;
				user-select: none !important;
			}

			.custom-file-upload:hover {
				background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%) !important;
				transform: translateY(-2px) scale(1.02) !important;
				box-shadow: 0 12px 30px rgba(37, 99, 235, 0.6) !important;
			}

			.custom-file-upload:active {
				transform: translateY(0) scale(0.98) !important;
			}

			.custom-file-upload input[type="file"] {
				display: none !important;
			}

			/* File Status Message Box */
			.file-status-box {
				background: rgba(15, 23, 42, 0.88) !important;
				backdrop-filter: blur(16px) !important;
				-webkit-backdrop-filter: blur(16px) !important;
				border: 1px solid rgba(255, 255, 255, 0.12) !important;
				padding: 10px 16px !important;
				border-radius: 12px !important;
				color: #94a3b8 !important;
				font-size: 0.83rem !important;
				font-weight: 500 !important;
				box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4) !important;
				display: flex !important;
				align-items: center !important;
				gap: 8px !important;
			}

			.file-status-box span.active-file {
				color: #38bdf8 !important;
				font-weight: 700 !important;
				font-family: 'JetBrains Mono', monospace !important;
			}

			/* Interactive Controls Overlay Panel (Renamed to avoid main.css width:100% collision) */
			.controls-panel {
				position: fixed !important;
				top: 20px !important;
				right: 20px !important;
				left: auto !important;
				bottom: auto !important;
				width: auto !important;
				min-width: 260px !important;
				max-width: 320px !important;
				z-index: 9999 !important;
				background: rgba(15, 23, 42, 0.88) !important;
				backdrop-filter: blur(16px) !important;
				-webkit-backdrop-filter: blur(16px) !important;
				border: 1px solid rgba(255, 255, 255, 0.12) !important;
				padding: 18px 22px !important;
				border-radius: 16px !important;
				color: #f8fafc !important;
				font-size: 0.88rem !important;
				box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5) !important;
				user-select: none !important;
				text-align: left !important;
			}

			.info-title {
				font-weight: 800;
				font-size: 0.95rem;
				color: #38bdf8;
				margin-bottom: 12px;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.info-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 8px;
				color: #cbd5e1;
			}

			.key-badge {
				display: inline-block;
				background: rgba(255, 255, 255, 0.12);
				border: 1px solid rgba(255, 255, 255, 0.2);
				padding: 3px 8px;
				border-radius: 6px;
				font-family: 'JetBrains Mono', monospace;
				font-weight: 700;
				font-size: 0.82rem;
				color: #f1f5f9;
			}

			.status-box {
				margin-top: 14px;
				padding-top: 12px;
				border-top: 1px dashed rgba(255, 255, 255, 0.15);
				font-size: 0.8rem;
				color: #94a3b8;
			}

			.status-item {
				display: flex;
				justify-content: space-between;
				margin-bottom: 4px;
			}

			.status-value {
				color: #38bdf8;
				font-weight: 700;
				font-family: 'JetBrains Mono', monospace;
			}

			/* Mobile Responsiveness */
			@media (max-width: 768px) {
				.top-bar-left {
					top: 14px !important;
					left: 14px !important;
					right: 14px !important;
					max-width: none !important;
				}
				.custom-file-upload {
					width: 100% !important;
					justify-content: center !important;
				}
				.controls-panel {
					top: auto !important;
					bottom: 14px !important;
					right: 14px !important;
					left: 14px !important;
					min-width: auto !important;
					max-width: none !important;
				}
			}
		</style>
	</head>
	<body>

		<!-- Top Left Header & File Controls -->
		<div class="top-bar-left">
			<label class="custom-file-upload">
				<input type="file" id="file-input" accept=".pcd">
				<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
					<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
					<polyline points="17 8 12 3 7 8"></polyline>
					<line x1="12" y1="3" x2="12" y2="15"></line>
				</svg>
				<span>Open Local .PCD File</span>
			</label>
			<div class="file-status-box" id="file-status-box">
				<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
				<span id="file-status-text">Example 1x1x1 cube shown, load a local .pcd file</span>
			</div>
		</div>

		<!-- Interactive Controls Overlay (Class controls-panel prevents main.css full-width overlay) -->
		<div class="controls-panel">
			<div class="info-title">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
				<span>Keyboard Controls</span>
			</div>
			
			<div class="info-row">
				<span>Point Size</span>
				<div><span class="key-badge">+</span> <span class="key-badge">-</span></div>
			</div>
			<div class="info-row">
				<span>Cycle Color Mode</span>
				<span class="key-badge">c</span>
			</div>
			<div class="info-row">
				<span>Toggle 1m XYZ Frame</span>
				<span class="key-badge">a</span>
			</div>

			<div class="status-box">
				<div class="status-item">
					<span>Color Mode:</span>
					<span class="status-value" id="status-color">RGB GRADIENT</span>
				</div>
				<div class="status-item">
					<span>XYZ Axis (1m):</span>
					<span class="status-value" id="status-axis">HIDDEN</span>
				</div>
			</div>
		</div>

		<!-- Import map polyfill -->
		<script async src="threejs/es-module-shims.js"></script>

		<script>
			// Dynamically configure import map to resolve local threejs relative to current location
			(function() {
				const pageUrl = window.location.href;
				const dirUrl = pageUrl.substring(0, pageUrl.lastIndexOf('/') + 1);
				const isFile = window.location.protocol === 'file:';

				const threePath = isFile 
					? 'https://unpkg.com/three@0.160.0/build/three.module.js'
					: dirUrl + 'threejs/three.module.js';

				const map = {
					imports: {
						"three": threePath
					}
				};

				const imScript = document.createElement('script');
				imScript.type = 'importmap';
				imScript.textContent = JSON.stringify(map);
				document.head.appendChild(imScript);
			})();
		</script>

		<script type="module">
			let THREE, OrbitControls, PCDLoader;

			const isFile = window.location.protocol === 'file:';
			if (isFile) {
				THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js');
				const controlsMod = await import('https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js');
				const loaderMod = await import('https://unpkg.com/three@0.160.0/examples/jsm/loaders/PCDLoader.js');
				OrbitControls = controlsMod.OrbitControls;
				PCDLoader = loaderMod.PCDLoader;
			} else {
				THREE = await import('three');
				const controlsMod = await import('./threejs/OrbitControls.js');
				const loaderMod = await import('./threejs/PCDLoader.js');
				OrbitControls = controlsMod.OrbitControls;
				PCDLoader = loaderMod.PCDLoader;
			}

			let camera, scene, renderer, controls, axesHelper;

			const colorModes = ['rgb', 'x', 'y', 'z', 'random'];
			let currentModeIndex = 0;

			function generateCubeCloud() {
				const count = 22; // 22 x 22 x 22 = 10,648 points
				const totalPoints = count * count * count;
				const positions = new Float32Array(totalPoints * 3);
				const colors = new Float32Array(totalPoints * 3);

				let idx = 0;
				for (let i = 0; i < count; i++) {
					const x = -0.5 + i / (count - 1);
					for (let j = 0; j < count; j++) {
						const y = -0.5 + j / (count - 1);
						for (let k = 0; k < count; k++) {
							const z = -0.5 + k / (count - 1);

							positions[idx] = x;
							positions[idx + 1] = y;
							positions[idx + 2] = z;

							colors[idx] = x + 0.5;
							colors[idx + 1] = y + 0.5;
							colors[idx + 2] = z + 0.5;

							idx += 3;
						}
					}
				}

				const geometry = new THREE.BufferGeometry();
				geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
				geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
				geometry.setAttribute('originalColor', new THREE.BufferAttribute(colors.slice(), 3));

				const material = new THREE.PointsMaterial({
					size: 0.015,
					vertexColors: true
				});

				const points = new THREE.Points(geometry, material);
				points.name = 'cloud';
				return points;
			}

			function applyColorMode(points, mode) {
				if (!points || !points.geometry) return;
				const geometry = points.geometry;
				const pos = geometry.attributes.position;
				if (!pos) return;

				if (mode === 'random') {
					points.material.vertexColors = false;
					points.material.color.setHex(Math.random() * 0xffffff);
					points.material.needsUpdate = true;
					return;
				}

				if (mode === 'rgb' && geometry.attributes.originalColor) {
					geometry.setAttribute('color', geometry.attributes.originalColor);
					geometry.attributes.color.needsUpdate = true;
					points.material.vertexColors = true;
					points.material.needsUpdate = true;
					return;
				}

				const count = pos.count;
				const colors = new Float32Array(count * 3);

				let minX = Infinity, maxX = -Infinity;
				let minY = Infinity, maxY = -Infinity;
				let minZ = Infinity, maxZ = -Infinity;

				for (let i = 0; i < count; i++) {
					const x = pos.getX(i);
					const y = pos.getY(i);
					const z = pos.getZ(i);
					if (x < minX) minX = x; if (x > maxX) maxX = x;
					if (y < minY) minY = y; if (y > maxY) maxY = y;
					if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
				}

				const rangeX = (maxX - minX) || 1;
				const rangeY = (maxY - minY) || 1;
				const rangeZ = (maxZ - minZ) || 1;

				for (let i = 0; i < count; i++) {
					const x = pos.getX(i);
					const y = pos.getY(i);
					const z = pos.getZ(i);

					let r = 0, g = 0, b = 0;

					if (mode === 'x') {
						const t = (x - minX) / rangeX;
						r = t;
						g = 1 - Math.abs(t - 0.5) * 2;
						b = 1 - t;
					} else if (mode === 'y') {
						const t = (y - minY) / rangeY;
						r = 1 - t;
						g = t;
						b = 0.5 + 0.5 * Math.sin(t * Math.PI);
					} else if (mode === 'z') {
						const t = (z - minZ) / rangeZ;
						r = 0.5 + 0.5 * Math.cos(t * Math.PI);
						g = 0.2 + 0.8 * t;
						b = 1 - t;
					} else { // default RGB gradient mapping
						r = (x - minX) / rangeX;
						g = (y - minY) / rangeY;
						b = (z - minZ) / rangeZ;
					}

					colors[i * 3] = r;
					colors[i * 3 + 1] = g;
					colors[i * 3 + 2] = b;
				}

				geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
				geometry.attributes.color.needsUpdate = true;
				points.material.vertexColors = true;
				points.material.needsUpdate = true;
			}

			function display_cloud( points ) {
				const existing = scene.getObjectByName( 'cloud' );
				if ( existing ) {
					scene.remove( existing );
				}

				points.geometry.center();
				points.geometry.computeBoundingSphere();
				points.name = 'cloud';

				// Store original PCD colors if available
				if ( points.geometry.attributes.color && !points.geometry.attributes.originalColor ) {
					points.geometry.setAttribute('originalColor', points.geometry.attributes.color.clone());
				}

				const radius = (points.geometry.boundingSphere && points.geometry.boundingSphere.radius > 0)
					? points.geometry.boundingSphere.radius 
					: 1;

				// Scale point size proportionally to cloud dimensions
				if ( points.material ) {
					points.material.size = Math.max( 0.01, radius * 0.015 );
				}

				// Apply current color mode
				applyColorMode(points, colorModes[currentModeIndex]);

				// Dynamically set camera distance and clip planes based on cloud radius
				camera.far = Math.max( 2000, radius * 20 );
				camera.updateProjectionMatrix();

				if ( controls ) {
					controls.maxDistance = Math.max( 1000, radius * 10 );
					controls.minDistance = Math.max( 0.001, radius * 0.001 );

					const dist = Math.max( 2, radius * 2.2 );
					camera.position.set( 0, 0, dist );
					controls.target.set( 0, 0, 0 );
					controls.update();
				}

				scene.add( points );
				render();
			}

			function toggleAxesHelper() {
				if (!axesHelper) {
					// Create 1m XYZ coordinate frame at origin (Red=X, Green=Y, Blue=Z)
					axesHelper = new THREE.AxesHelper(1.0);
					scene.add(axesHelper);
					axesHelper.visible = true;
				} else {
					axesHelper.visible = !axesHelper.visible;
				}

				const statusEl = document.getElementById('status-axis');
				if (statusEl) {
					statusEl.textContent = axesHelper.visible ? 'VISIBLE (1m RGB)' : 'HIDDEN';
				}
				render();
			}

			function load_file(e) {            
				var file = e.target.files[0];
				if (!file) return;

				// Update filename status banner
				const statusTextEl = document.getElementById('file-status-text');
				if (statusTextEl) {
					const sizeKb = (file.size / 1024).toFixed(1);
					statusTextEl.innerHTML = `Loaded file: <span class="active-file">${file.name}</span> (${sizeKb} KB)`;
				}

				var reader = new FileReader();
				reader.onload = function(e) {
					var contents = e.target.result;
					const loader = new PCDLoader();
					var points = loader.parse(contents);
					display_cloud(points);
				};
				reader.readAsArrayBuffer(file);
			}

			function init() {
				document.getElementById('file-input').addEventListener('change', load_file, false);

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 30, window.innerWidth / window.innerHeight, 0.01, 1000 );
				camera.position.set( 0, 0, 3 );
				scene.add( camera );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', render );

				// Add initial 1x1x1 cube point cloud (10,648 points)
				const initialCloud = generateCubeCloud();
				display_cloud( initialCloud );

				window.addEventListener( 'resize', onWindowResize );
				window.addEventListener( 'keypress', keyboard );

				render();
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );
				render();
			}

			function keyboard( ev ) {
				const points = scene.getObjectByName( 'cloud' );

				const key = ev.key || String.fromCharCode( ev.keyCode || ev.charCode );

				switch ( key ) {
					case '+':
						if (points) points.material.size *= 1.25;
						break;

					case '-':
						if (points) points.material.size /= 1.25;
						break;

					case 'c':
					case 'C':
						currentModeIndex = (currentModeIndex + 1) % colorModes.length;
						const mode = colorModes[currentModeIndex];
						if (points) applyColorMode(points, mode);
						const statusEl = document.getElementById('status-color');
						if (statusEl) {
							statusEl.textContent = mode.toUpperCase() + (mode !== 'random' ? ' COLORMAP' : '');
						}
						break;

					case 'a':
					case 'A':
						toggleAxesHelper();
						break;
				}

				render();
			}

			function render() {
				if ( renderer && scene && camera ) {
					renderer.render( scene, camera );
				}
			}

			init();
		</script>
	</body>
</html>
