<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal - Icon Selector</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* Custom font for a clean look */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117; /* Dark background */
        }
        /* Style for the game icon card */
        .game-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(255, 255, 255, 0.1);
            background-color: #161b22;
        }
        .icon {
            font-size: 3rem;
            /* Default color for 'Coming Soon' icons */
            color: #FFC107; 
        }
    </style>
</head>

        <p class="text-lg text-gray-400">Select a game to start playing!</p>
    </header>

    <!-- Game Icon Grid Container -->
    <!-- Responsive Grid: 2 columns on small, 3 on medium, 5 on large (2 rows of 5) -->
    <main class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 w-full max-w-6xl">
