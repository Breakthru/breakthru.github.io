<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Catcher</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Outfit:wght@400;600;800&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121005;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        #scoreDisplay, #highScoreDisplay, #livesDisplay, #backBtn {
            position: absolute;
            z-index: 10;
            background: rgba(18, 16, 5, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 204, 2, 0.3);
            color: #ffffff;
            border-radius: 12px;
            padding: 8px 16px;
            transition: all 0.2s ease;
        }

        #backBtn {
            top: 20px;
            left: 20px;
            font-size: 1.1rem;
            text-decoration: none;
            z-index: 30;
        }
        #backBtn:hover {
            background: rgba(255, 204, 2, 0.2);
            border-color: rgba(255, 204, 2, 0.8);
            transform: scale(1.05);
        }

        #scoreDisplay {
            top: 20px;
            right: 20px;
            font-size: 1.25rem;
            font-weight: 800;
        }

        #highScoreDisplay {
            top: 75px;
            right: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        #livesDisplay {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(18, 16, 5, 0.9);
            z-index: 20;
        }
    </style>
</head>
<body>

    <a id="backBtn" href="index.html">
        <i class="fa-solid fa-arrow-left mr-2"></i>Back
    </a>
    <div id="scoreDisplay">Score: <span id="scoreVal">0</span></div>
    <div id="highScoreDisplay">Best: <span id="highScoreVal">0</span></div>
    <div id="livesDisplay">Lives: <span id="livesVal">3</span></div>

    <!-- Start Modal -->
    <div id="startModal" class="modal-container">
        <div class="bg-gray-900 border border-yellow-500/50 p-8 rounded-2xl text-center max-w-sm mx-4 shadow-2xl shadow-yellow-500/10">
            <i class="fa-solid fa-bucket text-6xl text-yellow-400 mb-4 animate-pulse"></i>
            <h1 class="text-3xl font-extrabold text-white mb-2" style="font-family: 'Fredoka One', cursive;">NEON CATCHER</h1>
            <p class="text-gray-400 mb-6">Drag the catcher left and right to capture falling neon stars. Avoid the red spiked core bombs!</p>
            <button onclick="startGame()" class="w-full bg-gradient-to-r from-yellow-400 to-amber-500 text-white font-bold py-3 px-6 rounded-xl hover:scale-105 transition transform duration-150 shadow-lg shadow-yellow-500/30">
                Start Catching
            </button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal-container hidden">
        <div class="bg-gray-900 border border-yellow-500/50 p-8 rounded-2xl text-center max-w-sm mx-4 shadow-2xl shadow-yellow-500/10">
            <i class="fa-solid fa-heart-crack text-6xl text-red-500 mb-4 animate-bounce"></i>
            <h1 class="text-3xl font-extrabold text-white mb-2" style="font-family: 'Fredoka One', cursive;">CONTAINMENT BREACH</h1>
            <p class="text-gray-400 mb-2">Energy shield depleted.</p>
            <p class="text-2xl font-bold text-yellow-400 mb-6">Score: <span id="finalScoreVal">0</span></p>
            <button onclick="resetGame()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-500 text-white font-bold py-3 px-6 rounded-xl hover:scale-105 transition transform duration-150 shadow-lg shadow-yellow-500/30">
                Recharge Shield
            </button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');
        const finalScoreVal = document.getElementById('finalScoreVal');
        const highScoreVal = document.getElementById('highScoreVal');
        const livesVal = document.getElementById('livesVal');
        const startModal = document.getElementById('startModal');
        const gameOverModal = document.getElementById('gameOverModal');

        let score = 0;
        let highScore = parseInt(localStorage.getItem('neon_catcher_highscore')) || 0;
        highScoreVal.innerText = highScore;

        let lives = 3;
        let isPlaying = false;
        let particles = [];
        let items = [];
        let nextSpawnTime = 0;

        // Catcher/Basket Config
        const catcher = {
            width: 120,
            height: 20,
            x: 0,
            y: 0,
            color: '#ffcc02'
        };

        const NEON_COLORS = ['#ffcc02', '#feca57', '#00FFFF', '#1dd1a1', '#ff9f43'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            catcher.y = canvas.height - 80;
            if (!isPlaying) {
                catcher.x = canvas.width / 2 - catcher.width / 2;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FallingItem {
            constructor() {
                this.radius = Math.random() * 8 + 12;
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = -this.radius - 20;
                
                this.isBomb = Math.random() < 0.25; // 25% bombs
                this.color = this.isBomb ? '#ff4444' : NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
                
                // Falling Speed
                this.speed = Math.random() * 2 + 3 + (score * 0.05);
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                if (!this.isBomb) {
                    // Star style drawing
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    // Inner highlight
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                } else {
                    // Bomb style drawing
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Drawing warning spikes
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.radius, this.y);
                    ctx.lineTo(this.x + this.radius, this.y);
                    ctx.moveTo(this.x, this.y - this.radius);
                    ctx.lineTo(this.x, this.y + this.radius);
                    ctx.stroke();
                }

                ctx.restore();
            }

            checkCatch(c) {
                // Check if bounding box overlap
                const itemBottom = this.y + this.radius;
                const itemLeft = this.x - this.radius;
                const itemRight = this.x + this.radius;

                if (itemBottom >= c.y && this.y - this.radius <= c.y + c.height) {
                    if (itemRight >= c.x && itemLeft <= c.x + c.width) {
                        return true;
                    }
                }
                return false;
            }
        }

        class CatcherParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.size = Math.random() * 3 + 1;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.03;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Input controls
        function moveCatcher(e) {
            if (!isPlaying) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            catcher.x = clientX - catcher.width / 2;
            
            // Boundary lock
            if (catcher.x < 0) catcher.x = 0;
            if (catcher.x + catcher.width > canvas.width) catcher.x = canvas.width - catcher.width;
        }

        window.addEventListener('mousemove', moveCatcher);
        window.addEventListener('touchmove', (e) => {
            moveCatcher(e);
            e.preventDefault();
        }, { passive: false });

        function createCatchExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push(new CatcherParticle(x, y, color));
            }
        }

        function gameLoop() {
            if (!isPlaying) return;

            // Clear Background
            ctx.fillStyle = '#0a0903';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid draw
            ctx.strokeStyle = 'rgba(255, 204, 2, 0.02)';
            ctx.lineWidth = 1;
            const gridSize = 70;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Spawn Falling elements
            const now = Date.now();
            if (now > nextSpawnTime) {
                items.push(new FallingItem());
                nextSpawnTime = now + Math.random() * 1000 + Math.max(300, 800 - (score * 10));
            }

            // Update & Draw Items
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.update();
                item.draw();

                // Check Catch
                if (item.checkCatch(catcher)) {
                    createCatchExplosion(item.x, item.y, item.color);
                    if (item.isBomb) {
                        lives--;
                        livesVal.innerText = lives;
                        if (lives <= 0) gameOver();
                    } else {
                        score += 10;
                        scoreVal.innerText = score;
                    }
                    items.splice(i, 1);
                    continue;
                }

                // Check Miss
                if (item.y - item.radius > canvas.height) {
                    if (!item.isBomb) {
                        lives--;
                        livesVal.innerText = lives;
                        if (lives <= 0) gameOver();
                    }
                    items.splice(i, 1);
                }
            }

            // Draw Catcher
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = catcher.color;
            ctx.fillStyle = catcher.color;
            ctx.beginPath();
            ctx.roundRect(catcher.x, catcher.y, catcher.width, catcher.height, 6);
            ctx.fill();
            
            // Draw inside basket grid lines
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(catcher.x, catcher.y, catcher.width, catcher.height);
            ctx.restore();

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            startModal.classList.add('hidden');
            isPlaying = true;
            score = 0;
            scoreVal.innerText = score;
            lives = 3;
            livesVal.innerText = lives;
            items = [];
            particles = [];
            nextSpawnTime = Date.now() + 500;
            
            catcher.x = canvas.width / 2 - catcher.width / 2;

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isPlaying = false;
            finalScoreVal.innerText = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_catcher_highscore', highScore);
                highScoreVal.innerText = highScore;
            }

            // Explode all items on game over
            for (let item of items) {
                createCatchExplosion(item.x, item.y, item.color);
            }

            gameOverModal.classList.remove('hidden');
        }

        function resetGame() {
            gameOverModal.classList.add('hidden');
            startGame();
        }
    </script>
</body>
</html>
