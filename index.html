<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Index</title>
    <meta name="description" content="Simple index portal linking directly to each subfolder application suite.">
    
    <!-- PWA Manifest & Mobile Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#080c14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Web Suite">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Dark Theme Colors */
            --bg-body: #080c14;
            --bg-card: rgba(20, 28, 45, 0.65);
            --bg-card-hover: rgba(28, 39, 64, 0.85);
            --bg-pill: rgba(255, 255, 255, 0.06);
            
            --border-card: rgba(255, 255, 255, 0.08);
            --border-card-hover: rgba(99, 102, 241, 0.45);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            
            --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
            --shadow-hover: 0 22px 45px -12px rgba(99, 102, 241, 0.35);
            
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 40px 0;
        }

        /* Ambient Background Lighting */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.22;
            animation: float 22s infinite ease-in-out alternate;
        }

        .orb-1 {
            top: -15%;
            left: -10%;
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, #6366f1, #4f46e5);
        }

        .orb-2 {
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, #06b6d4, #3b82f6);
            animation-delay: -8s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(45px, 65px) scale(1.08); }
            100% { transform: translate(-35px, -45px) scale(0.92); }
        }

        /* Layout Container */
        .app-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* App Grid Layout */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 28px;
            width: 100%;
        }

        /* App Card Styling */
        .app-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-xl);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.35s var(--transition-smooth);
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        /* Accent Gradient Top Line */
        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--card-accent-gradient, linear-gradient(90deg, #6366f1, #a855f7));
            opacity: 0.45;
            transition: opacity 0.35s ease, height 0.35s ease;
        }

        .app-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-card-hover);
            background: var(--bg-card-hover);
            box-shadow: var(--shadow-hover);
        }

        .app-card:hover::before {
            opacity: 1;
            height: 5px;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        /* SVG Icon Badge */
        .app-icon-badge {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-icon-bg, rgba(99, 102, 241, 0.12));
            border: 1px solid var(--card-icon-border, rgba(99, 102, 241, 0.25));
            color: var(--card-icon-color, #6366f1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: transform 0.35s var(--transition-smooth), box-shadow 0.35s ease;
        }

        .app-card:hover .app-icon-badge {
            transform: scale(1.1) rotate(-3deg);
            box-shadow: 0 12px 30px var(--card-icon-glow, rgba(99, 102, 241, 0.35));
        }

        .folder-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 20px;
            background: var(--bg-pill);
            border: 1px solid var(--border-card);
            color: var(--text-dim);
            font-weight: 500;
        }

        .card-body {
            flex-grow: 1;
            margin-bottom: 24px;
        }

        .suite-badge-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--card-accent-color, var(--primary));
            margin-bottom: 8px;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .app-description {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 18px;
        }

        /* Included Items / Features Box */
        .features-box {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-top: 14px;
        }

        .features-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .features-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .feature-chip {
            font-size: 0.75rem;
            padding: 3px 9px;
            border-radius: 6px;
            background: var(--bg-pill);
            color: var(--text-muted);
            font-weight: 500;
            border: 1px solid var(--border-card);
        }

        /* Card Footer Launch Button */
        .card-footer {
            padding-top: 20px;
            border-top: 1px solid var(--border-card);
        }

        .launch-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--card-accent-gradient, linear-gradient(135deg, #6366f1, #4f46e5));
            color: white;
            padding: 12px 22px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s var(--transition-smooth);
            box-shadow: 0 4px 14px var(--card-shadow-glow, rgba(99, 102, 241, 0.3));
            width: 100%;
            justify-content: center;
        }

        .app-card:hover .launch-btn {
            filter: brightness(1.12);
            box-shadow: 0 6px 20px var(--card-shadow-glow, rgba(99, 102, 241, 0.45));
            transform: translateY(-2px);
        }

        .launch-btn svg {
            transition: transform 0.25s ease;
        }

        .app-card:hover .launch-btn svg {
            transform: translateX(5px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 24px 0;
            }
            .app-wrapper {
                padding: 0 16px;
            }
            .app-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

        // Render Suites Function
        function renderSuites() {
            const appGrid = document.getElementById('app-grid');
            if (!appGrid) return;

            appGrid.innerHTML = suitesData.map(suite => `
                <a href="${suite.path}" 
                    class="app-card" 
                    style="
                        --card-accent-gradient: ${suite.accentGradient};
                        --card-icon-bg: ${suite.iconBg};
                        --card-icon-border: ${suite.iconBorder};
                        --card-icon-color: ${suite.iconColor};
                        --card-icon-glow: ${suite.shadowGlow};
                        --card-shadow-glow: ${suite.shadowGlow};
                        --card-accent-color: ${suite.iconColor};
                    "
                >
                    <div class="card-header">
                        <div class="app-icon-badge">
                            ${suite.iconSvg}
                        </div>
                        <span class="folder-badge">/${suite.folder}/</span>

                    <div class="card-body">
                        <span class="suite-badge-tag">${suite.badgeText}</span>
                        <h3 class="app-title">${suite.title}</h3>

                        <div class="features-box">
                            <div class="features-title">Included Apps & Features</div>
                            <div class="features-list">
                                ${suite.features.map(f => `<span class="feature-chip">${f}</span>`).join('')}

                    </div>

                    <div class="card-footer">
                        <div class="launch-btn">
                            <span>Open ${suite.title}</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                        </div>

                </a>
            `).join('');
        }

        renderSuites();

        // --- PWA Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Suite PWA Service Worker registered:', reg.scope))
                    .catch(err => console.log('Suite PWA Service Worker registration failed:', err));

        }
    </script>
